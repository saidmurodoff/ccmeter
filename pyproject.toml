[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccmeter"
version = "1.1.0"
description = "Учёт токенов и лимитов Claude Code по локальным логам"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ccmeter = "ccmeter:main"

[tool.setuptools]
py-modules = ["ccmeter"]
